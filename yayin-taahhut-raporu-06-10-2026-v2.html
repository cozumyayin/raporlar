<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yayın Taahhüt Raporu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1c2745; --navy2:#2a3760; --red:#d7263d; --orange:#e98b2a; --green:#1f8a5b; --blue:#2f5fb3;
  --bg:#eef1f6; --card:#fff; --line:#e3e7ef; --ink:#1a2238; --muted:#667085; --soft:#f6f8fb;
  --chip-g:#e6f5ee; --chip-o:#fff3e3; --chip-r:#fde8eb; --chip-b:#e8effb; --chip-n:#eef0f4;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header.top{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:#c4cbe0;font-size:13px}
.top .date{text-align:right}
.top .date small{display:block;font-size:10px;letter-spacing:.18em;color:#9aa5c4;font-weight:600}
.top .date b{font-size:20px}
.stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 34%,var(--orange) 34% 54%,var(--navy2) 54%);border-radius:0 0 4px 4px;margin-bottom:16px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 8px;border-radius:9px;background:var(--red);color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.badge.sm{min-width:34px;height:34px;font-size:12px;border-radius:7px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.panel h2{margin:0;padding:14px 18px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 span{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
.pad{padding:16px 18px}
/* overview cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.pub{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:12px;transition:transform .12s, box-shadow .12s, border-color .12s;position:relative}
.pub:hover,.pub:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(28,39,69,.12);border-color:#c9d1e3;outline:none}
.pub .hd{display:flex;gap:12px;align-items:center}
.pub .hd b{display:block;font-size:16px;font-weight:800}
.pub .hd small{color:var(--muted);font-size:12px}
.pub .big{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em}
.pub .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pub .rows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pub .rows div b{display:block;font-family:var(--mono);font-size:15px}
.pub .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--blue);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pub .accent{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.c-g{background:var(--chip-g);color:#156b46;border-color:#bfe5d2}
.c-o{background:var(--chip-o);color:#a85a08;border-color:#f6d3a6}
.c-r{background:var(--chip-r);color:#b11a30;border-color:#f5bcc5}
.c-b{background:var(--chip-b);color:#244c93;border-color:#c5d5f2}
.c-n{background:var(--chip-n);color:#555f73;border-color:#dde1e8}
.date-pill{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip-r);color:#b11a30;border:1px solid #f1a9b4;white-space:nowrap}
.date-pill.o{background:#fff6e8;color:#8a4a06;border-color:#f3c98c}
.date-pill.n{background:var(--chip-n);color:#555f73;border-color:#dde1e8}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:150px 70px 1fr;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:start}
.tl-row:last-child{border-bottom:0}
.tl-row .d{font-weight:700;font-size:14px}
.tl-row .n{font-family:var(--mono);font-weight:700;font-size:18px;text-align:center}
.tl-row .n small{display:block;font-family:Inter,sans-serif;font-size:10px;color:var(--muted);font-weight:600}
.tl-items{display:flex;flex-direction:column;gap:6px}
.tl-item{display:flex;gap:8px;align-items:baseline}
.tl-item .what{flex:1}
.tl-item .who{font-weight:800;font-size:12px;min-width:92px}
.tl-item .what{color:#3b4458}
.month{background:var(--soft);font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:7px 18px;border-bottom:1px solid var(--line);text-transform:uppercase}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 10px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.main td{border-bottom:0}
td.num{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.idx{font-family:var(--mono);color:var(--muted);font-size:12px;width:34px}
td .b{font-weight:800;font-size:14px}
td .s{color:var(--muted);font-size:12px}
td.note{color:#3b4458;font-size:12.5px;min-width:240px}
.bar{height:6px;background:#e9edf3;border-radius:4px;overflow:hidden;width:80px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.d i{background:var(--blue)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em}
.kpi span{display:block;font-weight:700;font-size:12px;margin-top:2px}
.kpi small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.k-g{border-left-color:var(--green)}.k-r{border-left-color:var(--red)}.k-o{border-left-color:var(--orange)}.k-b{border-left-color:var(--blue)}
/* detail */
.back{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);margin-bottom:12px}
.back:hover{border-color:#c4cbdb}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cols{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.list li:last-child{border-bottom:0}
.list li i{font-style:normal;flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--chip-r);color:#b11a30;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.list.chk li i{background:var(--chip-o);color:#a85a08}
.quote{border-left:4px solid var(--red);background:var(--soft);padding:14px 18px;border-radius:0 8px 8px 0;font-size:15px;line-height:1.6;margin:0}
.quote footer{margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ms div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--soft)}
.ms b{display:block;font-family:var(--mono);font-size:17px}
.ms span{font-size:12px;color:var(--muted)}
.rule{background:var(--soft);padding:12px 18px;font-size:12.5px;color:#3b4458;border-top:1px solid var(--line)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.prod-grid>div{padding:0}
.prod-grid>div+div{border-left:1px solid var(--line)}
.prod-grid h3{margin:0;padding:12px 18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--soft);display:flex;justify-content:space-between}
.prod-grid ol{margin:0;padding:6px 18px 12px 40px}
.prod-grid li{padding:5px 0;font-size:13px;border-bottom:1px dashed #edf0f5}
.prod-grid li:last-child{border-bottom:0}
.prod-grid a{color:var(--ink);text-decoration:none}
.prod-grid a:hover{color:var(--blue);text-decoration:underline}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.mini>div{padding:12px 18px;border-right:1px solid var(--line)}
.mini>div:last-child{border-right:0}
.mini b{display:block}
.mini small{color:var(--muted)}
.mini .v{font-family:var(--mono);font-weight:700}
.src{font-size:11.5px;color:var(--muted);margin-top:4px}
footer.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 18px}
.hide{display:none!important}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:16px}
  .grid4{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}
  .tl-row{grid-template-columns:1fr;gap:6px}.tl-row .n{text-align:left}
  .ms,.mini,.prod-grid{grid-template-columns:1fr}.prod-grid>div+div{border-left:0;border-top:1px solid var(--line)}
  .mini>div{border-right:0;border-bottom:1px solid var(--line)}
  .top .date{text-align:left}
}
</style>
</head>

function backBtn(){ return `<button class="back" data-go="home">← Tüm yayınlar</button>`; }

/* ============ YÖNLENDİRME ============ */
const VIEWS = {home:overview, "3d":detail3d, "4k":detail4k, ev:detailEv, "3do":detail3do};
function route(){
  const h = (location.hash||'#home').slice(1);
  (VIEWS[h]||overview)();
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ const id=g.dataset.go; if(location.hash.slice(1)===id) route(); else location.hash = id; return; }
  const t = e.target.closest('[data-ev]');
  if(t){ evTab = t.dataset.ev; detailEv(); }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
